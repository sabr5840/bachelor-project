name: pension-ai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pension-ai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-StrongPassword123}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - pension_ai_sqlserver_data:/var/opt/mssql

volumes:
  pension_ai_sqlserver_data: